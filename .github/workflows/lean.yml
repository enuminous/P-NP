name: Lean verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Check for unfinished proofs
        run: |
          if grep -nE '\b(sorry|admit)\b' WrightSAT.lean; then
            echo 'Unfinished proof marker detected'
            exit 1
          fi
