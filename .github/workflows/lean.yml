name: Lean verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Lean library and audit theorem dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lake update
          lake build
          lake env lean ProofAudit.lean
      - name: Reject unfinished proof markers
        run: |
          if grep -nE '\b(sorry|admit)\b' WrightSAT.lean; then exit 1; fi
